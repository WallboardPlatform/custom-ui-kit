<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Device overview · Plain JavaScript</title></head><body><header class="wb-header"><div class="wb-brand"><span class="wb-mark" aria-hidden="true">W</span><div><strong>Device overview</strong><small>Plain JavaScript starter</small></div></div><button id="sign-out" class="wb-button wb-button-quiet" hidden>Sign out</button></header><main class="wb-main"><section id="connection" class="wb-card wb-signin"><span class="wb-eyebrow">WALLBOARD</span><h1>Connect your Wallboard</h1><form id="server-form"><label for="server">Wallboard server URL</label><input id="server" name="server" type="url" required class="wb-input" placeholder="https://your-wallboard.example" style="display:block;width:100%;margin:12px 0 20px"><button class="wb-button">Continue with Wallboard</button></form><p id="message" role="status"></p></section><section id="dashboard" hidden><div class="wb-page-heading"><div><span class="wb-eyebrow">DEVICE OVERVIEW</span><h1>Keep your screens in view.</h1><p>The first 100 devices in your customer. Build your next screen from this framework-independent example.</p></div><button id="refresh" class="wb-button wb-button-quiet">Refresh</button></div><div id="scope" class="wb-scope" hidden><label for="customer">Customer</label><select id="customer" class="wb-input"><option value="">Choose a customer</option></select></div><p id="data-message" role="status"></p><div id="devices" class="wb-grid"></div></section></main><script type="module" src="/main.ts"></script></body></html>
